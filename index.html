<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6ed" />
    <meta name="description" content="根据家中现有食材和饮食偏好，为你智能搭配今天的菜单。" />
    <meta property="og:title" content="今天吃什么 · 智能菜单" />
    <meta property="og:description" content="告诉我冰箱里有什么，剩下的交给搭配师。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>今天吃什么 · 智能菜单</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">TODAY'S TABLE</p>
          <h1>今天，吃点好的</h1>
          <p>告诉我冰箱里有什么，剩下的交给搭配师。</p>
        </div>
        <button id="install-button" class="profile-button" type="button" aria-label="安装到设备" title="安装到设备">＋</button>
      </header>

      <section class="card pantry-card" aria-labelledby="pantry-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">STEP 01</p>
            <h2 id="pantry-title">家里有什么？</h2>
          </div>
          <span id="selected-count" class="count-badge">已选 0 种</span>
        </div>

        <div class="ingredient-search">
          <span aria-hidden="true">⌕</span>
          <input id="ingredient-search" type="search" placeholder="输入任意食材，如：排骨、牛奶、芹菜" autocomplete="off" />
        </div>
        <div class="quick-add" aria-label="常用食材">
          <button type="button" class="quick-chip" data-ingredient="鸡蛋">🥚 鸡蛋</button>
          <button type="button" class="quick-chip" data-ingredient="番茄">🍅 番茄</button>
          <button type="button" class="quick-chip" data-ingredient="鸡胸肉">🍗 鸡胸肉</button>
          <button type="button" class="quick-chip" data-ingredient="土豆">🥔 土豆</button>
          <button type="button" class="quick-chip" data-ingredient="豆腐">◻️ 豆腐</button>
        </div>
        <div id="selected-ingredients" class="selected-ingredients" aria-live="polite"></div>
        <div id="ingredient-results" class="ingredient-results" aria-live="polite"></div>
      </section>

      <section class="preferences" aria-labelledby="preference-title">
        <div class="section-heading compact-heading">
          <div>
            <p class="section-kicker">STEP 02</p>
            <h2 id="preference-title">今天想怎么吃？</h2>
          </div>
        </div>
        <div class="preference-row">
          <label>
            <span>菜系</span>
            <select id="cuisine-select">
              <option value="不限">不限菜系</option>
              <option value="家常">家常菜</option>
              <option value="川味">川味</option>
              <option value="粤式">粤式</option>
              <option value="江南">江南菜</option>
              <option value="闽南">闽南菜</option>
              <option value="北方">北方菜</option>
              <option value="轻食">轻食</option>
            </select>
          </label>
          <label>
            <span>用餐人数</span>
            <select id="people-select">
              <option value="1">1 人</option>
              <option value="2" selected>2 人</option>
              <option value="3">3 人</option>
              <option value="4">4 人</option>
            </select>
          </label>
        </div>
        <p class="option-label">饮食目标</p>
        <div class="goal-options" role="group" aria-label="饮食目标">
          <button type="button" class="goal-chip active" data-goal="均衡营养">均衡营养</button>
          <button type="button" class="goal-chip" data-goal="减脂轻食">减脂轻食</button>
          <button type="button" class="goal-chip" data-goal="高蛋白">高蛋白</button>
          <button type="button" class="goal-chip" data-goal="省时快手">省时快手</button>
        </div>
      </section>

      <button id="recommend-button" class="recommend-button" type="button">
        <span>✨</span> 生成今日菜单
      </button>

      <section id="recommendation" class="recommendation hidden" aria-live="polite">
        <div class="recommendation-topline">
          <div>
            <p class="section-kicker">YOUR MENU</p>
            <h2>为你搭配这一餐</h2>
          </div>
          <button id="refresh-button" class="text-button" type="button">↻ 换一批</button>
        </div>
        <p id="menu-reason" class="menu-reason"></p>
        <div id="dish-list" class="dish-list"></div>
        <div id="nutrition-summary" class="nutrition-summary"></div>
        <button id="shopping-button" class="shopping-button" type="button">查看缺少的食材</button>
      </section>

      <section id="favorites-panel" class="utility-page hidden" aria-labelledby="favorites-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">MY RECIPES</p>
            <h2 id="favorites-title">我的收藏</h2>
          </div>
          <span id="favorites-count" class="count-badge">0 道菜</span>
        </div>
        <p class="utility-intro">在菜谱详情页点“收藏这道菜”，下次就能在这里快速找到。</p>
        <div id="favorites-list" class="dish-list"></div>
      </section>

      <section id="library-panel" class="utility-page hidden" aria-labelledby="library-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">INGREDIENT LIBRARY</p>
            <h2 id="library-title">食材库</h2>
          </div>
          <span class="count-badge">点选即可添加</span>
        </div>
        <p class="utility-intro">按类别挑选家里现有的食材，它们会自动加入首页的“家里有什么”。</p>
        <div id="library-list" class="library-list"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="底部导航">
      <button class="nav-item active" type="button" data-view="today"><span>⌂</span>今日</button>
      <button class="nav-item" type="button" data-view="favorites"><span>♡</span>收藏</button>
      <button class="nav-item" type="button" data-view="library"><span>▣</span>食材库</button>
    </nav>

    <dialog id="recipe-dialog" class="recipe-dialog">
      <button class="dialog-close" type="button" aria-label="关闭">×</button>
      <div id="recipe-content"></div>
    </dialog>
    <dialog id="shopping-dialog" class="shopping-dialog">
      <button class="dialog-close" type="button" aria-label="关闭">×</button>
      <h2>补货清单</h2>
      <p>完成这套餐食，只差这些：</p>
      <ul id="shopping-list"></ul>
      <button class="dialog-action" type="button">保存到采购清单</button>
    </dialog>

    <script src="./app.js?v=5"></script>
  </body>
</html>
